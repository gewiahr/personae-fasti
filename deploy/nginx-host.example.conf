# Replace the certificate paths if Certbot uses a combined certificate name.

server {
    listen 80;
    server_name app.storyshard.ru api.storyshard.ru img.storyshard.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name app.storyshard.ru;

    ssl_certificate /etc/letsencrypt/live/app.storyshard.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.storyshard.ru/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:17003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl http2;
    server_name api.storyshard.ru;

    ssl_certificate /etc/letsencrypt/live/api.storyshard.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.storyshard.ru/privkey.pem;

    client_max_body_size 32m;
    proxy_connect_timeout 10s;
    proxy_read_timeout 130s;
    proxy_send_timeout 130s;

    location / {
        proxy_pass http://127.0.0.1:17001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl http2;
    server_name img.storyshard.ru;

    ssl_certificate /etc/letsencrypt/live/img.storyshard.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/img.storyshard.ru/privkey.pem;

    location / {
        # Garage's public web endpoint resolves the bucket from this host name.
        proxy_pass http://127.0.0.1:3902;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# Private S3 API bridge for the Storyshard API container. For tighter access,
# replace this private-range allowance with the storyshard Docker subnet.
server {
    listen 17002;
    server_name _;

    allow 127.0.0.1;
    allow 172.16.0.0/12;
    deny all;

    client_max_body_size 32m;
    proxy_connect_timeout 10s;
    proxy_read_timeout 130s;
    proxy_send_timeout 130s;

    location / {
        proxy_pass http://127.0.0.1:3900;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
