name: storyshard

x-api: &api
  image: ${API_IMAGE:-storyshard-api:latest}
  restart: unless-stopped
  environment:
    CONFIG_PATH: /app/mnt
    CONFIG_NAME: storyshard
  volumes:
    - storyshard:/app/mnt:ro
  extra_hosts:
    - "host.docker.internal:host-gateway"
  networks:
    - storyshard

services:
  api:
    <<: *api
    ports:
      - "127.0.0.1:${API_HOST_PORT:-17001}:17001"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:17001/readyz"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s

  migrate:
    <<: *api
    restart: "no"
    command: ["migrate"]
    profiles: ["tools"]

  web:
    image: ${WEB_IMAGE:-storyshard-web:latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-17003}:80"
    networks:
      - storyshard
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  storyshard:
    name: storyshard

networks:
  storyshard:
    name: storyshard
